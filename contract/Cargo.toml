[package]
name = "earned-price"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Earned Price: testnet escrow that pays agents only when a TEE grade passes."

[lib]
name = "earned_price"
crate-type = ["cdylib", "rlib"]

[dependencies]
# "unstable" only gates env::ecrecover (plus store::TreeMap, unused) in 5.30.0;
# the ecrecover host function itself is part of the stable protocol (T-022).
near-sdk = { version = "=5.30.0", features = ["unstable"] }
# Workaround (T-003, 2026-11-10): near-sys 0.4.1 moved universal-accounts host
# functions behind a feature that near-sdk 5.30.0 does not enable, so near-sdk
# fails to compile. Enabling the feature here fixes it via feature unification.
# Remove when moving to a near-sdk release that enables it itself.
near-sys = { version = "=0.4.1", features = ["universal-accounts"] }

[features]
# Exposes test_pay_seller for the sandbox balance test only. Never deploy a build
# with this feature (scripts/deploy.sh builds without it).
sandbox-test = []

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing", "unstable"] }
# Sandbox balance test (tests/sandbox.rs, only with --features sandbox-test).
# 0.24.0 (2026-10-26, 15 days old): 0.23.0 pins near-crypto 0.37, which conflicts with near-sdk 5.30.0.
near-workspaces = "=0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[package.metadata.near.reproducible_build]
# Filled in when the build is pinned for verification (T-003 / T-013).
