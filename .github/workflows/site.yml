# [CTO] T-033 · site CI (ADR-001 Addendum B: R9 size gate + Playwright WebKit from day one).
# Runs once the repo has a GitHub remote (A-021). Free for public repos. No secrets, no deploy.
# Actions are pinned by commit SHA (code review N-2); the comment names the release.
name: site
on:
  push:
    paths: ["app/**", "site/**", "scripts/site-*.mjs", "package.json", "package-lock.json", "next.config.ts", "tsconfig.json", "playwright.config.ts", "vercel.json", ".github/workflows/site.yml"]
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run site:typecheck
      - run: npm run site:unit
      - run: npm run build # site rules + data gate + next build + size gate
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run site:e2e
        env: { CI: "true" }
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
